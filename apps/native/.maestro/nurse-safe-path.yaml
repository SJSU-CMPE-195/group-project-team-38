appId: com.meditag.native
env:
  MAESTRO_NURSE_EMAIL: "nurse-demo@meditag.test"
  MAESTRO_NURSE_PASSWORD: "meditag-demo-123"
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/sign-in.yaml
- tapOn:
    id: start-wristband-scan-button
- assertVisible: "Scan patient wristband"
- assertVisible: "Simulator demo wristbands"
- tapOn:
    id: demo-wristband-WRISTBAND-SAFE-QR-001
- assertVisible: "Wristband captured"
- tapOn:
    id: continue-with-wristband-button
- extendedWaitUntil:
    visible:
      id: scan-handoff-screen-title
    timeout: 20000
- assertVisible: "Demo Safe Patient"
- scrollUntilVisible:
    element:
      id: medication-option-161
    direction: DOWN
    timeout: 20000
- tapOn:
    id: medication-option-161
- extendedWaitUntil:
    visible: "Selected medication"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: continue-to-verification-button
    timeout: 20000
- tapOn:
    id: continue-to-verification-button
- extendedWaitUntil:
    visible:
      id: verify-screen-title
    timeout: 20000
- tapOn:
    id: run-deterministic-verification-button
- extendedWaitUntil:
    visible: "PASS"
    timeout: 20000
- assertVisible: "The medication matches the patient record and no allergy conflict was found."
