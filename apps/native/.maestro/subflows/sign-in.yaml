appId: com.meditag.native
env:
  MAESTRO_NURSE_EMAIL: "nurse-demo@meditag.test"
  MAESTRO_NURSE_PASSWORD: "meditag-demo-123"
---
- runFlow:
    when:
      visible:
        id: welcome-login-button
    commands:
      - tapOn:
          id: welcome-login-button
      - assertVisible:
          id: sign-in-demo-button
      - tapOn:
          id: sign-in-demo-button
- extendedWaitUntil:
    visible: "Start patient verification"
    timeout: 20000
