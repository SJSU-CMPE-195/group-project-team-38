appId: com.meditag.native
env:
  MAESTRO_NURSE_EMAIL: ""
  MAESTRO_NURSE_PASSWORD: ""
---
- assertVisible:
    id: sign-in-submit-button
- tapOn:
    id: sign-in-email-input
- inputText: "${MAESTRO_NURSE_EMAIL}"
- tapOn:
    id: sign-in-password-input
- inputText: "${MAESTRO_NURSE_PASSWORD}"
- tapOn:
    id: sign-in-submit-button
- extendedWaitUntil:
    visible: "Start patient verification"
    timeout: 20000
