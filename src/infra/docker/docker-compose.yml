services:
  db:
    image: postgres:16
    container_name: meditag_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meditag
      POSTGRES_PASSWORD: meditag_pw
      POSTGRES_DB: meditag
    ports:
      - "5432:5432"
    volumes:
      - meditag_pgdata:/var/lib/postgresql/data

volumes:
  meditag_pgdata:
