name: TestFlight

on:
  workflow_dispatch:
    inputs:
      release_environment:
        description: GitHub environment that provides the mobile backend URLs
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  build-and-upload:
    name: Build and upload iOS app
    runs-on: macos-latest
    environment:
      name: ${{ inputs.release_environment }}
    env:
      EXPO_PUBLIC_CONVEX_URL: ${{ secrets.EXPO_PUBLIC_CONVEX_URL }}
      EXPO_PUBLIC_CONVEX_SITE_URL: ${{ secrets.EXPO_PUBLIC_CONVEX_SITE_URL }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
      APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: List project docs
        run: bun run docs:list

      - name: Prepare App Store Connect API key
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cat <<'EOF' > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8"
          ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY }}
          EOF

      - name: Archive iOS app
        working-directory: apps/native/ios
        run: |
          xcodebuild \
            -workspace meditag.xcworkspace \
            -scheme meditag \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/meditag.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_CONNECT_API_ISSUER_ID" \
            archive

      - name: Create export options
        working-directory: apps/native/ios
        run: |
          cat <<EOF > build/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        working-directory: apps/native/ios
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/meditag.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_CONNECT_API_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: meditag-ios-${{ inputs.release_environment }}
          path: apps/native/ios/build/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        run: |
          xcrun altool \
            --upload-package apps/native/ios/build/export/meditag.ipa \
            --apiKey "$APPSTORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_API_ISSUER_ID" \
            --wait
